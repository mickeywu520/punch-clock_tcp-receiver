[package]
name = "punch-clock-tcp-receiver"
version = "0.1.0"
edition = "2021"
description = "SOYAL AR837EF punch clock TCP receiver that parses active-message events and forwards normalized JSON to GCP"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
iced = { version = "0.14", features = ["tokio"] }
if-addrs = "0.13"
muda = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tray-icon = "0.19"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
iced_graphics = "0.14"
ttf-parser = "0.25"

[profile.release]
lto = true